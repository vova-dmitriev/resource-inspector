<body>
<main>
<header><h1>__TITLE__</h1><div class="header-controls"><button class="language-toggle" type="button" aria-label="Switch language to English" title="Switch language to English">EN</button><button class="theme-toggle" type="button" aria-label="Switch to light theme" title="Switch to light theme"></button></div></header>
<div class="resource-controls" hidden><label><span class="resource-profile-label"></span><select class="resource-profile-select"></select></label><button class="resource-settings-button" type="button"></button><a class="resource-hub-link" href="/" hidden>Проекты</a></div>
<dialog class="resource-panel" aria-labelledby="resource-panel-title"><header><h2 class="resource-panel-title" id="resource-panel-title"></h2><button class="resource-panel-close" type="button"></button></header><div class="resource-inspector-body"></div><div class="resource-settings-body" hidden></div></dialog>
<nav class="tabs" role="tablist"></nav><div class="panels"></div>
</main>
<script type="application/json" id="map-data">__MAP_DATA__</script>
<script>
const data = JSON.parse(document.getElementById("map-data").textContent)
const inspectorBasePath = document.querySelector('meta[name="resource-inspector-base-path"]')?.content ?? ""
const inspectorHubUrl = document.querySelector('meta[name="resource-inspector-hub-url"]')?.content ?? "/"
const inspectorUrl = (path) => `${inspectorBasePath}${path}`
const tabList = document.querySelector(".tabs")
const panels = document.querySelector(".panels")
const themeToggle = document.querySelector(".theme-toggle")
const languageToggle = document.querySelector(".language-toggle")
const resourceControls = document.querySelector(".resource-controls")
const resourceProfileSelect = document.querySelector(".resource-profile-select")
const resourceProfileLabel = document.querySelector(".resource-profile-label")
const resourceSettingsButton = document.querySelector(".resource-settings-button")
const resourceHubLink = document.querySelector(".resource-hub-link")
const resourcePanel = document.querySelector(".resource-panel")
const resourcePanelTitle = document.querySelector(".resource-panel-title")
const resourcePanelClose = document.querySelector(".resource-panel-close")
const resourceInspectorBody = document.querySelector(".resource-inspector-body")
const resourceSettingsBody = document.querySelector(".resource-settings-body")
const edgeTooltip = document.createElement("div")
edgeTooltip.className = "edge-tooltip"
edgeTooltip.setAttribute("role", "tooltip")
edgeTooltip.hidden = true
document.body.append(edgeTooltip)
const svgNamespace = "http://www.w3.org/2000/svg"
const SunIcon = __SUN_ICON__
const MoonIcon = __MOON_ICON__
const supportedLocales = ["ru", "en"]
const localeStorageKey = "architecture-map-locale"
let locale
try {
  const savedLocale = localStorage.getItem(localeStorageKey)
  locale = supportedLocales.includes(savedLocale) ? savedLocale : data.i18n?.defaultLocale
} catch {
  locale = data.i18n?.defaultLocale
}
if (!supportedLocales.includes(locale)) locale = "ru"
document.documentElement.lang = locale
tabList.setAttribute("aria-label", data.translations?.[locale]?.ui?.sectionsLabel ?? "Architecture map sections")
const localizedTitle = data.translations?.[locale]?.page?.title ?? data.title
document.title = localizedTitle
document.querySelector("h1").textContent = localizedTitle

function ui(key, fallback) {
  return data.translations?.[locale]?.ui?.[key] ?? fallback
}

function localized(section, id, field, fallback) {
  return data.translations?.[locale]?.[section]?.[id]?.[field] ?? fallback
}

function resourceText(key, fallback) {
  return ui(key, fallback)
}

function positionTooltip(x, y) {
  edgeTooltip.style.left = `${Math.max(8, Math.min(x + 12, window.innerWidth - edgeTooltip.offsetWidth - 8))}px`
  edgeTooltip.style.top = `${Math.max(8, Math.min(y + 12, window.innerHeight - edgeTooltip.offsetHeight - 8))}px`
}

function setLocaleControl() {
  const nextLocale = locale === "ru" ? "en" : "ru"
  const label = ui("switchLanguage", `Switch language to ${nextLocale.toUpperCase()}`)
  languageToggle.textContent = nextLocale.toUpperCase()
  languageToggle.setAttribute("aria-label", label)
  languageToggle.title = label
}


function element(name, attributes = {}, ...children) {
  const item = document.createElement(name)

  for (const [key, value] of Object.entries(attributes)) item.setAttribute(key, value)
  for (const child of children) {
    if (typeof child === "string") item.append(document.createTextNode(child))
    else if (child instanceof Node) item.append(child)
  }

  return item
}

function svgElement(name, attributes = {}, text) {
  const item = document.createElementNS(svgNamespace, name)

  for (const [key, value] of Object.entries(attributes)) item.setAttribute(key, value)
  if (text !== undefined) item.textContent = text

  return item
}

function jsonBlock(value) {
  const block = element("pre", { class: "resource-json" })
  const code = element("code")
  const lines = JSON.stringify(value === undefined ? null : value, null, 2).split("\n")
  const tokenPattern = /"(?:\\.|[^"\\])*"(?=\s*:)|"(?:\\.|[^"\\])*"|-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?|\b(?:true|false|null)\b|[{}\[\],:]/g

  for (const line of lines) {
    const indentation = line.length - line.trimStart().length
    const depth = Math.min(Math.floor(indentation / 2), 4)
    const content = line.trimStart()
    const jsonLine = element("span", { class: `json-depth-${depth}` })
    jsonLine.style.paddingLeft = `${indentation}ch`
    let offset = 0

    for (const match of content.matchAll(tokenPattern)) {
      const token = match[0]
      const index = match.index ?? offset
      if (index > offset) jsonLine.append(document.createTextNode(content.slice(offset, index)))
      const kind = token.startsWith('"') ? (content.slice(index + token.length).trimStart().startsWith(":") ? "key" : "string")
        : token === "true" || token === "false" ? "boolean"
        : token === "null" ? "null"
        : /^[{}\[\],:]$/.test(token) ? "punctuation" : "number"
      jsonLine.append(element("span", { class: `json-${kind}` }, token))
      offset = index + token.length
    }

    if (offset < content.length) jsonLine.append(document.createTextNode(content.slice(offset)))
    code.append(jsonLine)
  }

  block.append(code)
  return block
}

let inspectorAvailable = false
let inspectorProfiles = []
let inspectorResources = []
let selectedResourceNode
let resourceNodeRenderSequence = 0
const resourceProfileStorageKey = "architecture-map-resource-profile"

async function initializeResourceInspector() {
  const hasBindings = data.tabs.some((tab) => tab.diagrams.some((diagram) => diagram.nodes.some((node) => Object.keys(node.resourceRefsByProfile ?? {}).length)))
  if (!hasBindings) return

  resourceControls.hidden = false
  resourceProfileLabel.textContent = resourceText("resourceProfile", "Environment")
  resourceSettingsButton.textContent = resourceText("resourceSettings", "Connections")
  if (inspectorBasePath) { resourceHubLink.hidden = false; resourceHubLink.href = inspectorHubUrl }
  resourcePanelClose.textContent = resourceText("resourceClose", "Close")
  resourcePanelClose.setAttribute("aria-label", resourcePanelClose.textContent)
  resourcePanelClose.addEventListener("click", () => resourcePanel.close())
  resourcePanel.addEventListener("click", (event) => { if (event.target === resourcePanel) resourcePanel.close() })
  resourcePanel.addEventListener("close", () => { selectedResourceNode = undefined })
  resourceSettingsButton.addEventListener("click", () => { void openResourceSettings() })
  resourceProfileSelect.addEventListener("change", () => {
    try { localStorage.setItem(resourceProfileStorageKey, resourceProfileSelect.value) } catch {}
    void refreshMapResourceStatuses()
    if (selectedResourceNode) void renderResourceNode(selectedResourceNode)
  })

  const declared = data.resourceProfiles ?? []
  inspectorProfiles = declared.map(({ id, name, kind }) => ({ id, name, kind }))
  try {
    const response = await fetch(inspectorUrl("/__resource-inspector/profiles"), { credentials: "same-origin", redirect: "error" })
    if (!response.ok) throw new Error()
    const payload = await response.json()
    inspectorProfiles = payload.profiles.filter((profile) => declared.some((item) => item.id === profile.id))
    inspectorAvailable = true
  } catch {
    inspectorAvailable = false
  }

  resourceProfileSelect.replaceChildren(...inspectorProfiles.map((profile) => element("option", { value: profile.id }, profile.name)))
  let savedProfile
  try { savedProfile = localStorage.getItem(resourceProfileStorageKey) } catch {}
  const selected = inspectorProfiles.some(({ id }) => id === savedProfile) ? savedProfile : inspectorProfiles[0]?.id
  if (selected) resourceProfileSelect.value = selected
  if (inspectorAvailable) {
    await loadInspectorResources()
    await refreshMapResourceStatuses()
    window.setInterval(() => { void refreshMapResourceStatuses() }, 15_000)
    window.setInterval(() => { if (resourcePanel.open && selectedResourceNode && resourceSettingsBody.hidden) void refreshResourceStatuses() }, 15_000)
  }
}

async function loadInspectorResources(profileId = resourceProfileSelect.value) {
  try {
    const response = await fetch(inspectorUrl(`/__resource-inspector/resources?profileId=${encodeURIComponent(profileId)}`), { credentials: "same-origin", redirect: "error" })
    if (!response.ok) throw new Error()
    const resources = (await response.json()).resources
    if (profileId === resourceProfileSelect.value) inspectorResources = resources
    return resources
  } catch {
    if (profileId === resourceProfileSelect.value) inspectorResources = []
    return []
  }
}

async function renderResourceNode(node) {
  const sequence = ++resourceNodeRenderSequence
  const profileId = resourceProfileSelect.value
  selectedResourceNode = node
  if (!resourcePanel.open) resourcePanel.showModal()
  resourceSettingsBody.hidden = true
  resourceInspectorBody.hidden = false
  resourcePanelTitle.textContent = localized("nodes", `${node.diagramId}:${node.id}`, "title", node.title)
  const ids = node.resourceRefsByProfile?.[profileId] ?? []

  if (!inspectorAvailable) {
    resourceInspectorBody.removeAttribute("data-loading")
    resourceInspectorBody.removeAttribute("aria-busy")
    resourceInspectorBody.replaceChildren()
    resourceInspectorBody.append(element("p", { class: "resource-notice" }, resourceText("resourceInspectorStatic", "Live inspection needs the local resource-inspector viewer. Open this map using the documented command.")))
    return
  }
  if (!ids.length) {
    resourceInspectorBody.removeAttribute("data-loading")
    resourceInspectorBody.removeAttribute("aria-busy")
    resourceInspectorBody.replaceChildren()
    resourceInspectorBody.append(element("p", { class: "resource-notice" }, resourceText("resourceNoBinding", "This node has no resource binding in the selected profile.")))
    return
  }

  resourceInspectorBody.dataset.loading = "true"
  resourceInspectorBody.setAttribute("aria-busy", "true")
  resourceInspectorBody.querySelector(".resource-node-loading")?.remove()
  const loadingStatus = element("p", { class: "resource-node-loading", role: "status" }, locale === "ru" ? "Обновляю профиль…" : "Updating profile…")
  resourceInspectorBody.append(loadingStatus)

  const resources = await loadInspectorResources(profileId)
  if (sequence !== resourceNodeRenderSequence || profileId !== resourceProfileSelect.value) return
  const items = []
  for (const id of ids) {
    const resource = resources.find((item) => item.id === id)
    if (!resource) {
      items.push(element("p", { class: "resource-notice" }, `${id}: ${resourceText("resourceMissing", "resource is not configured")}`))
      continue
    }
    items.push(createResourceItem(resource))
  }
  resourceInspectorBody.replaceChildren(...items)
  resourceInspectorBody.removeAttribute("data-loading")
  resourceInspectorBody.removeAttribute("aria-busy")
  await refreshResourceStatuses(profileId)
}

function createResourceItem(resource) {
  const item = element("article", { class: "resource-item", "data-resource-id": resource.id })
  const title = element("h3", {}, resource.name)
  const status = element("p", { class: "resource-status", "data-state": "unknown" }, resourceText("resourceLoading", "Checking status…"))
  const controls = element("div", { class: "resource-view-controls" })
  const isDatabase = resource.kind === "database"
  const presentation = element("div", { class: "resource-presentation-controls", hidden: "" })
  const timelineButton = element("button", { type: "button", "aria-pressed": "true" }, resourceText("resourceTimeline", locale === "ru" ? "Таймлайн" : "Timeline"))
  const jsonButton = element("button", { type: "button", "aria-pressed": "false" }, "JSON")
  const output = element("div", { class: "resource-output", hidden: "" })
  const result = element("div", { class: "resource-result" })
  const loadingIndicator = element("p", {
    class: "resource-loading-indicator",
    role: "status",
    hidden: "",
  }, resourceText("resourceLoading", locale === "ru" ? "Загрузка…" : "Loading…"))
  const metadata = element("div")
  const state = {
    sequence: 0,
    value: undefined,
    view: isDatabase ? "tables" : "",
    displayTable: "",
    mode: "timeline",
    tables: [],
    selectedTable: "",
    columnWidthsByTable: {},
    tableSearch: "",
    search: "",
    offset: 0,
    gridScrollPositions: { rows: 0, schema: 0 },
    databaseCache: {},
    sortBy: "",
    sortDirection: "asc",
    loading: false,
    loadingMore: false,
    loadMoreError: "",
    error: "",
    database: isDatabase,
    loadingIndicator,
  }
  metadata.append(title, status)
  if (isDatabase) item.dataset.resourceKind = "database"
  output.append(presentation, result, loadingIndicator)
  const views = (resource.views ?? []).filter((view) => view !== "status")
  const databaseBrowser = isDatabase
    ? createDatabaseBrowser(state, {
      selectTable: (table) => {
        window.clearTimeout(databaseSearchTimer)
        state.selectedTable = table
        state.search = ""
        state.offset = 0
        state.gridScrollPositions = { rows: 0, schema: 0 }
        state.sortBy = ""
        state.loadingMore = false
        state.loadMoreError = ""
        loadDatabaseView(state.view === "schema" ? "schema" : "rows")
      },
      selectView: (view) => {
        window.clearTimeout(databaseSearchTimer)
        state.offset = 0
        state.loadingMore = false
        state.loadMoreError = ""
        loadDatabaseView(view)
      },
      searchRows: (value) => {
        state.search = value.trim()
        state.offset = 0
        state.gridScrollPositions.rows = 0
        state.loadingMore = false
        state.loadMoreError = ""
        window.clearTimeout(databaseSearchTimer)
        databaseSearchTimer = window.setTimeout(() => loadDatabaseView("rows", 0), 250)
      },
      loadMore: () => {
        if (state.loadingMore || !state.value?.hasMore || state.view !== "rows") return
        state.loadMoreError = ""
        loadDatabaseView("rows", state.offset, true)
      },
      sortColumn: (column) => {
        window.clearTimeout(databaseSearchTimer)
        state.sortDirection = state.sortBy === column && state.sortDirection === "asc" ? "desc" : "asc"
        state.sortBy = column
        state.offset = 0
        state.gridScrollPositions.rows = 0
        state.loadingMore = false
        state.loadMoreError = ""
        loadDatabaseView("rows", 0)
      },
      refresh: () => {
        window.clearTimeout(databaseSearchTimer)
        state.value = undefined
        state.tables = []
        state.columnWidthsByTable = {}
        state.view = "tables"
        state.offset = 0
        state.loadingMore = false
        state.loadMoreError = ""
        void inspectResource(resource.id, "tables", output, result, state, renderOutput)
      },
    })
    : undefined
  let databaseSearchTimer

  function loadDatabaseView(view, offset = 0, append = false) {
    state.view = view
    if (!append) {
      state.offset = offset
      const cached = state.databaseCache[databaseCacheKey(state.selectedTable, view, state.sortBy, state.sortDirection)]
      if (cached) {
        state.value = cached
        state.loading = false
        state.error = ""
        state.displayTable = state.selectedTable
        state.offset = view === "rows" ? cached.offset + cached.rows.length : 0
        state.loadingIndicator.hidden = true
        output.removeAttribute("aria-busy")
        databaseBrowser.render()
        return
      }
    }
    const input = view === "rows"
      ? {
        table: state.selectedTable,
        limit: 50,
        offset,
        ...(state.search ? { search: state.search } : {}),
        ...(state.sortBy ? { sortBy: state.sortBy, sortDirection: state.sortDirection } : {}),
      }
      : { table: state.selectedTable }
    state.loadingMore = append
    state.loadMoreError = ""
    void inspectResource(resource.id, view, output, result, state, renderOutput, input, append, append ? databaseBrowser : undefined)
  }

  function databaseCacheKey(table, view, sortBy, sortDirection) {
    return JSON.stringify([table, view, view === "rows" ? state.search : "", view === "rows" ? sortBy : "", view === "rows" ? sortDirection : ""])
  }

  function renderOutput() {
    if (databaseBrowser) {
      if (state.view === "tables" && Array.isArray(state.value)) {
        state.tables = state.value.filter((table) => typeof table === "string")
        if (!state.tables.includes(state.selectedTable)) state.selectedTable = ""
        if (state.selectedTable) {
          state.view = "rows"
          void loadDatabaseView("rows")
          return
        }
      }
      if (state.error && state.value !== undefined) {
        databaseBrowser.showViewError()
        return
      }
      databaseBrowser.render()
      if (databaseBrowser.element.parentElement !== result) result.replaceChildren(databaseBrowser.element)
      return
    }

    const scrollTop = result.scrollTop
    result.replaceChildren()
    const hasTimeline = state.view === "logs" || state.view === "requests"
    presentation.hidden = !hasTimeline
    if (hasTimeline && state.mode === "timeline") result.append(renderEventTimeline(state.value))
    else result.append(jsonBlock(state.value))
    requestAnimationFrame(() => { result.scrollTop = scrollTop })
  }

  timelineButton.addEventListener("click", () => {
    state.mode = "timeline"
    timelineButton.setAttribute("aria-pressed", "true")
    jsonButton.setAttribute("aria-pressed", "false")
    renderOutput()
  })
  jsonButton.addEventListener("click", () => {
    state.mode = "json"
    timelineButton.setAttribute("aria-pressed", "false")
    jsonButton.setAttribute("aria-pressed", "true")
    renderOutput()
  })
  presentation.append(timelineButton, jsonButton)

  if (!isDatabase) {
    for (const [index, view] of views.entries()) {
      const inspect = element("button", { type: "button", "aria-pressed": String(index === 0) }, view)
      inspect.addEventListener("click", () => {
        controls.querySelectorAll("button").forEach((button) => button.setAttribute("aria-pressed", String(button === inspect)))
        state.view = view
        state.mode = "timeline"
        timelineButton.setAttribute("aria-pressed", "true")
        jsonButton.setAttribute("aria-pressed", "false")
        void inspectResource(resource.id, view, output, result, state, renderOutput)
      })
      controls.append(inspect)
    }
  }
  controls.hidden = isDatabase || views.length === 0
  item.append(metadata, controls, output)
  if (views.length) {
    state.view = views[0]
    void inspectResource(resource.id, views[0], output, result, state, renderOutput)
  }
  return item
}

function createDatabaseBrowser(state, actions) {
  const browser = element("section", { class: "database-browser", "aria-label": locale === "ru" ? "Обозреватель базы данных" : "Database browser" })
  const sidebar = element("aside", { class: "database-sidebar" })
  const sidebarHeading = element("div", { class: "database-sidebar-heading" })
  const tableCount = element("span", { class: "database-table-count" })
  const refreshButton = element("button", { type: "button", class: "database-pagination-button", "aria-label": locale === "ru" ? "Обновить список таблиц" : "Refresh table list" }, "↻")
  const search = element("input", {
    class: "database-search",
    type: "search",
    "aria-label": locale === "ru" ? "Поиск таблицы" : "Search tables",
    placeholder: locale === "ru" ? "Найти таблицу…" : "Search tables…",
  })
  const tableList = element("nav", { class: "database-table-list", "aria-label": locale === "ru" ? "Таблицы базы данных" : "Database tables" })
  const main = element("div", { class: "database-main" })
  const mainContent = element("div", { class: "database-content" })
  const viewButtons = new Map()
  const viewLoading = element("span", { class: "database-switch-status", role: "status", hidden: "" })
  const rowSearch = element("input", {
    class: "database-row-search",
    type: "search",
    "aria-label": locale === "ru" ? "Поиск по всем полям таблицы" : "Search all table fields",
    placeholder: locale === "ru" ? "Поиск по всем полям…" : "Search all fields…",
  })
  const virtualization = { rowHeight: 40, overscanRows: 8, fetchThreshold: 240 }
  let viewTabs
  let rowsBody
  let rowsGrid
  let rowCountLabel
  let loadStatus
  let virtualRenderFrame = 0

  sidebarHeading.append(element("span", {}, locale === "ru" ? "Таблицы" : "Tables"), tableCount, refreshButton)
  sidebar.append(sidebarHeading, search, tableList)
  main.append(mainContent)
  browser.append(sidebar, main)

  function renderTableList() {
    const query = state.tableSearch.trim().toLowerCase()
    const tables = state.tables.filter((table) => table.toLowerCase().includes(query))
    tableCount.textContent = String(state.tables.length)
    const renderKey = JSON.stringify([query, tables])
    if (tableList.dataset.renderKey === renderKey) {
      for (const button of tableList.querySelectorAll(".database-table-button")) {
        button.setAttribute("aria-current", String(button.textContent === state.selectedTable))
      }
      return
    }
    const previousQuery = tableList.dataset.query
    const scrollTop = tableList.scrollTop
    tableList.replaceChildren()
    tableList.dataset.renderKey = renderKey
    tableList.dataset.query = query
    if (!tables.length) {
      tableList.append(element("p", { class: "database-empty" }, state.tables.length
        ? locale === "ru" ? "Таблицы не найдены." : "No tables match."
        : locale === "ru" ? "Таблиц нет." : "No tables."))
      return
    }
    for (const table of tables) {
      const button = element("button", {
        type: "button",
        class: "database-table-button",
        "aria-current": String(table === state.selectedTable),
      }, table)
      button.addEventListener("click", () => actions.selectTable(table))
      tableList.append(button)
    }
    if (previousQuery === query) tableList.scrollTop = scrollTop
  }

  function setLoadingView(view) {
    for (const button of tableList.querySelectorAll(".database-table-button")) {
      button.setAttribute("aria-current", String(button.textContent === state.selectedTable))
    }
    for (const [name, button] of viewButtons) button.setAttribute("aria-pressed", String(name === view))
    rowSearch.value = state.search
    rowSearch.hidden = view !== "rows"
    viewLoading.hidden = false
    viewLoading.dataset.state = "loading"
    viewLoading.textContent = locale === "ru" ? "Загрузка…" : "Loading…"
    if (viewTabs && viewLoading.parentElement !== viewTabs) viewTabs.append(viewLoading)
  }

  function showViewError() {
    viewLoading.hidden = false
    viewLoading.dataset.state = "error"
    viewLoading.textContent = state.error
    if (viewTabs && viewLoading.parentElement !== viewTabs) viewTabs.append(viewLoading)
  }

  function renderSchema() {
    const columns = state.value?.columns ?? []
    const table = element("table", { class: "database-grid" })
    const head = element("thead")
    const header = element("tr")
    header.append(element("th", {}, locale === "ru" ? "Колонка" : "Column"), element("th", {}, locale === "ru" ? "Тип данных" : "Data type"))
    head.append(header)
    const body = element("tbody")
    for (const column of columns) {
      const row = element("tr")
      row.append(element("td", {}, column.column_name), element("td", {}, column.data_type))
      body.append(row)
    }
    table.append(head, body)
    const grid = element("div", { class: "database-grid-wrap" }, table)
    grid.addEventListener("scroll", () => {
      state.gridScrollPositions.schema = grid.scrollTop
    }, { passive: true })
    mainContent.append(grid)
    requestAnimationFrame(() => { grid.scrollTop = state.gridScrollPositions.schema })
  }

  function formatDatabaseCell(value) {
    return value === null || value === undefined ? "NULL" : typeof value === "object" ? JSON.stringify(value) : String(value)
  }

  function createColumnGroup(columns, rows) {
    const signature = JSON.stringify(columns.map(({ column_name, data_type }) => [column_name, data_type]))
    const cachedWidths = state.columnWidthsByTable[state.selectedTable]
    const widths = cachedWidths?.signature === signature
      ? cachedWidths.widths
      : columns.map((column) => {
        const longestValueLength = rows.reduce((longest, row) => {
          return Math.max(longest, formatDatabaseCell(row[column.column_name]).length)
        }, column.column_name.length + 2)

        return Math.min(448, Math.max(96, longestValueLength * 8 + 28))
      })

    state.columnWidthsByTable[state.selectedTable] = { signature, widths }
    const columnGroup = element("colgroup")
    let totalWidth = 0

    for (const width of widths) {
      const columnElement = element("col")
      columnElement.style.width = `${width}px`
      totalWidth += width
      columnGroup.append(columnElement)
    }

    return { columnGroup, totalWidth }
  }

  function createRow(record, columns) {
    const row = element("tr")
    for (const column of columns) {
      const cellValue = record[column.column_name]
      const isNull = cellValue === null || cellValue === undefined
      const text = formatDatabaseCell(cellValue)
      const cell = element("td", { title: text, "data-null": String(isNull) })
      appendSearchHighlight(cell, text, state.search)
      row.append(cell)
    }
    return row
  }

  function createSpacerRow(height, columnCount) {
    const row = element("tr", { class: "database-virtual-spacer", "aria-hidden": "true" })
    const cell = element("td", { colspan: String(columnCount) })
    cell.style.height = `${height}px`
    cell.style.padding = "0"
    cell.style.border = "0"
    row.append(cell)
    return row
  }

  function renderVirtualRows() {
    if (!rowsBody || !rowsGrid) return
    const rows = state.value?.rows ?? []
    const columns = state.value?.columns ?? []
    const bodyTop = Math.max(0, rowsGrid.scrollTop - rowsGrid.querySelector("thead")?.offsetHeight)
    const start = Math.max(0, Math.floor(bodyTop / virtualization.rowHeight) - virtualization.overscanRows)
    const end = Math.min(
      rows.length,
      Math.ceil((bodyTop + rowsGrid.clientHeight) / virtualization.rowHeight) + virtualization.overscanRows,
    )
    const fragment = document.createDocumentFragment()

    if (start > 0) fragment.append(createSpacerRow(start * virtualization.rowHeight, columns.length))
    for (let index = start; index < end; index += 1) fragment.append(createRow(rows[index], columns))
    if (end < rows.length) fragment.append(createSpacerRow((rows.length - end) * virtualization.rowHeight, columns.length))

    rowsBody.replaceChildren(fragment)
  }

  function scheduleVirtualRows() {
    if (virtualRenderFrame) return
    virtualRenderFrame = requestAnimationFrame(() => {
      virtualRenderFrame = 0
      renderVirtualRows()
    })
  }

  function renderLoadStatus() {
    loadStatus?.remove()
    loadStatus = undefined
    if (state.loadingMore) {
      loadStatus = element("p", { class: "database-load-status", role: "status" }, locale === "ru" ? "Загружаю следующие строки…" : "Loading more rows…")
    } else if (state.loadMoreError) {
      loadStatus = element("button", { type: "button", class: "database-load-retry" }, locale === "ru" ? "Не удалось загрузить. Повторить" : "Could not load rows. Retry")
      loadStatus.addEventListener("click", actions.loadMore)
    }
    if (loadStatus) mainContent.append(loadStatus)
  }

  function renderRows() {
    const value = state.value
    if (!value || !Array.isArray(value.rows)) {
      mainContent.append(element("p", { class: "database-empty" }, locale === "ru" ? "Нет строк." : "No rows."))
      return
    }
    const columns = value.columns ?? []
    const table = element("table", { class: "database-grid" })
    const { columnGroup, totalWidth } = createColumnGroup(columns, value.rows)
    table.style.width = `${totalWidth}px`
    const head = element("thead")
    const header = element("tr")
    for (const column of columns) {
      const sort = element("button", { type: "button", class: "database-sort-button" }, `${column.column_name}${state.sortBy === column.column_name ? state.sortDirection === "asc" ? " ↑" : " ↓" : ""}`)
      sort.addEventListener("click", () => actions.sortColumn(column.column_name))
      header.append(element("th", {}, sort))
    }
    head.append(header)
    rowsBody = element("tbody")
    table.append(columnGroup, head, rowsBody)
    rowsGrid = element("div", { class: "database-grid-wrap" })
    rowsGrid.append(table)
    rowsGrid.addEventListener("scroll", () => {
      state.gridScrollPositions.rows = rowsGrid.scrollTop
      scheduleVirtualRows()
      if (rowsGrid.scrollHeight - rowsGrid.clientHeight - rowsGrid.scrollTop <= virtualization.fetchThreshold) actions.loadMore()
    }, { passive: true })
    mainContent.append(rowsGrid)
    rowsGrid.scrollTop = state.gridScrollPositions.rows
    renderVirtualRows()
    renderLoadStatus()
    requestAnimationFrame(() => {
      renderVirtualRows()
      if (rowsGrid.scrollHeight <= rowsGrid.clientHeight && value.hasMore && !state.loadingMore && !state.loadMoreError) actions.loadMore()
    })
  }

  function appendRows() {
    renderVirtualRows()
    if (rowCountLabel) rowCountLabel.textContent = formatLoadedDatabaseRows(state.value)
    renderLoadStatus()
  }

  function setLoadingMore() {
    renderLoadStatus()
  }

  function showLoadMoreError() {
    renderLoadStatus()
  }

  function render() {
    renderTableList()
    main.replaceChildren()
    const heading = element("div", { class: "database-main-heading" })
    heading.append(element("h4", {}, state.displayTable || state.selectedTable || (locale === "ru" ? "Выберите таблицу" : "Select a table")))
    if (state.view === "rows" && state.value?.rows) {
      rowCountLabel = element("span", { class: "database-row-count" }, formatLoadedDatabaseRows(state.value))
      heading.append(rowCountLabel)
    } else {
      rowCountLabel = undefined
    }
    main.append(heading)

    const tabs = element("div", { class: "database-view-tabs" })
    viewTabs = tabs
    viewButtons.clear()
    for (const [view, label] of [["rows", locale === "ru" ? "Данные" : "Data"], ["schema", locale === "ru" ? "Структура" : "Columns"]]) {
      const button = element("button", { type: "button", class: "database-view-tab", "aria-pressed": String(state.view === view) }, label)
      button.disabled = !state.selectedTable
      button.addEventListener("click", () => actions.selectView(view))
      viewButtons.set(view, button)
      tabs.append(button)
    }
    rowSearch.value = state.search
    rowSearch.hidden = state.view !== "rows"
    tabs.append(rowSearch)
    viewLoading.hidden = true
    viewLoading.dataset.state = ""
    if (state.loading && state.value !== undefined) {
      viewLoading.hidden = false
      viewLoading.dataset.state = "loading"
      viewLoading.textContent = locale === "ru" ? "Загрузка…" : "Loading…"
      tabs.append(viewLoading)
    }
    main.append(tabs)
    main.append(mainContent)
    mainContent.replaceChildren()
    if (state.loading) {
      mainContent.append(element("p", { class: "database-empty" }, locale === "ru" ? "Загружаю данные…" : "Loading data…"))
    } else if (state.error) {
      mainContent.append(element("p", { class: "database-empty" }, state.error))
    } else if (!state.selectedTable) {
      mainContent.append(element("p", { class: "database-empty" }, state.tables.length ? locale === "ru" ? "Выберите таблицу слева." : "Select a table from the list." : locale === "ru" ? "В этой схеме нет таблиц." : "This schema has no tables."))
    } else if (state.view === "schema") {
      renderSchema()
    } else if (state.view === "rows") {
      renderRows()
    } else {
      mainContent.append(element("p", { class: "database-empty" }, locale === "ru" ? "Загружаю список таблиц…" : "Loading tables…"))
    }
  }

  search.addEventListener("input", () => {
    state.tableSearch = search.value
    renderTableList()
  })
  rowSearch.addEventListener("input", () => actions.searchRows(rowSearch.value))
  refreshButton.addEventListener("click", actions.refresh)

  return { element: browser, render, appendRows, setLoadingMore, showLoadMoreError, setLoadingView, showViewError }
}

function formatDatabaseCount(value) {
  try {
    return new Intl.NumberFormat(locale).format(BigInt(value))
  } catch {
    return String(value ?? 0)
  }
}

function formatLoadedDatabaseRows(value) {
  const loaded = value.offset + value.rows.length
  const total = formatDatabaseCount(value.totalRows ?? loaded)
  const formattedLoaded = formatDatabaseCount(loaded)

  return locale === "ru" ? `Загружено: ${formattedLoaded} из ${total}` : `Loaded: ${formattedLoaded} of ${total}`
}

function appendSearchHighlight(target, text, query) {
  const normalizedQuery = query.toLocaleLowerCase(locale)
  if (!normalizedQuery) {
    target.append(document.createTextNode(text))
    return
  }

  const normalizedText = text.toLocaleLowerCase(locale)
  let start = 0
  let matchIndex = normalizedText.indexOf(normalizedQuery, start)
  while (matchIndex !== -1) {
    if (matchIndex > start) target.append(document.createTextNode(text.slice(start, matchIndex)))
    const matchEnd = matchIndex + normalizedQuery.length
    target.append(element("mark", { class: "database-match" }, text.slice(matchIndex, matchEnd)))
    start = matchEnd
    matchIndex = normalizedText.indexOf(normalizedQuery, start)
  }
  if (start < text.length) target.append(document.createTextNode(text.slice(start)))
}

async function refreshResourceStatuses(profileId = resourceProfileSelect.value) {
  if (!selectedResourceNode || !inspectorAvailable) return
  if (profileId !== resourceProfileSelect.value) return
  const items = resourceInspectorBody.querySelectorAll(".resource-item")
  await Promise.all([...items].map(async (item) => {
    const id = item.dataset.resourceId
    const status = item.querySelector(".resource-status")
    try {
      const query = new URLSearchParams({ profileId, resourceId: id })
      const response = await fetch(inspectorUrl(`/__resource-inspector/status?${query}`), { credentials: "same-origin", redirect: "error" })
      if (!response.ok) throw new Error()
      const value = await response.json()
      if (profileId !== resourceProfileSelect.value || !status.isConnected) return
      status.dataset.state = value.state ?? "unknown"
      status.textContent = `${resourceStateLabel(value.state)} · ${new Date(value.checkedAt).toLocaleTimeString(locale)}`
      if (value.exitCode !== undefined) status.textContent += ` · exit ${value.exitCode}`
    } catch {
      if (profileId !== resourceProfileSelect.value || !status.isConnected) return
      status.dataset.state = "unreachable"
      status.textContent = resourceText("resourceFailed", "Status unavailable")
    }
  }))
}

async function inspectResource(resourceId, view, output, result, state, renderOutput, input = {}, append = false, databaseBrowser) {
  const sequence = ++state.sequence
  output.hidden = false
  state.loading = !append
  state.loadingMore = append
  state.error = ""
  state.loadMoreError = ""
  state.loadingIndicator.hidden = true
  output.setAttribute("aria-busy", "true")
  if (state.database && append) databaseBrowser?.setLoadingMore()
  else if (state.database) {
    databaseBrowser?.setLoadingView(view)
    if (databaseBrowser?.element.parentElement !== result) {
      databaseBrowser?.render()
      if (databaseBrowser) result.replaceChildren(databaseBrowser.element)
    }
  } else if (state.value !== undefined) {
    state.loadingIndicator.hidden = false
    state.loadingIndicator.dataset.state = "loading"
    state.loadingIndicator.textContent = resourceText("resourceLoading", locale === "ru" ? "Загрузка…" : "Loading…")
  } else {
    result.replaceChildren(element("p", { class: "resource-notice" }, resourceText("resourceLoading", "Loading…")))
  }
  try {
    const response = await fetch(inspectorUrl("/__resource-inspector/inspect"), {
      method: "POST",
      credentials: "same-origin",
      redirect: "error",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ profileId: resourceProfileSelect.value, resourceId, view, input }),
    })
    if (!response.ok) throw new Error()
    const value = await response.json()
    if (sequence !== state.sequence) return
    state.value = append && Array.isArray(state.value?.rows) && Array.isArray(value.rows)
      ? { ...value, offset: state.value.offset, rows: [...state.value.rows, ...value.rows] }
      : value
    state.loading = false
    state.loadingMore = false
    state.loadingIndicator.hidden = true
    output.removeAttribute("aria-busy")
    if (!append && view !== "tables" && state.database) state.displayTable = state.selectedTable
    if (view !== "tables" && state.database) {
      const cacheKey = JSON.stringify([state.selectedTable, view, view === "rows" ? state.sortBy : "", view === "rows" ? state.sortDirection : ""])
      state.databaseCache[cacheKey] = state.value
    }
    if (view === "rows" && Array.isArray(value.rows)) state.offset = value.offset + value.rows.length
    if (sequence === state.sequence) {
      if (append && state.database) databaseBrowser?.appendRows()
      else renderOutput()
    }
  } catch {
    if (sequence === state.sequence) {
      state.loading = false
      state.loadingMore = false
      output.removeAttribute("aria-busy")
      if (append) {
        state.loadMoreError = resourceText("resourceFailed", "Could not load more rows")
        databaseBrowser?.showLoadMoreError()
      } else {
        state.error = resourceText("resourceFailed", "Inspection failed")
        if (state.database) {
          if (state.value !== undefined) databaseBrowser?.showViewError()
          else renderOutput()
        } else if (state.value !== undefined) {
          state.loadingIndicator.hidden = false
          state.loadingIndicator.dataset.state = "error"
          state.loadingIndicator.textContent = state.error
        } else {
          result.replaceChildren(element("p", { class: "resource-notice" }, state.error))
        }
      }
    }
  }
}

async function refreshMapResourceStatuses() {
  if (!inspectorAvailable || !resourceProfileSelect.value) return
  const profileId = resourceProfileSelect.value
  const nodes = data.tabs.flatMap((tab) => tab.diagrams.flatMap((diagram) => diagram.nodes))
    .filter((node) => (node.resourceRefsByProfile?.[profileId] ?? []).length > 0)
  const resourceIds = [...new Set(nodes.flatMap((node) => node.resourceRefsByProfile[profileId]))]
  const statuses = new Map()

  await Promise.all(resourceIds.map(async (resourceId) => {
    try {
      const query = new URLSearchParams({ profileId, resourceId })
      const response = await fetch(inspectorUrl(`/__resource-inspector/status?${query}`), { credentials: "same-origin", redirect: "error" })
      if (!response.ok) throw new Error()
      statuses.set(resourceId, (await response.json()).state ?? "unknown")
    } catch {
      statuses.set(resourceId, "unreachable")
    }
  }))
  if (profileId !== resourceProfileSelect.value) return

  for (const node of nodes) {
    const states = (node.resourceRefsByProfile[profileId] ?? []).map((id) => statuses.get(id) ?? "unknown")
    const state = states.find((value) => ["stopped", "degraded", "unreachable"].includes(value))
      ?? (states.every((value) => value === "running") ? "running" : states.includes("starting") ? "starting" : "unknown")
    const group = document.querySelector(`.node[data-diagram-id="${CSS.escape(node.diagramId)}"][data-node-id="${CSS.escape(node.id)}"]`)
    if (!group) continue
    group.dataset.resourceState = state
    const dot = group.querySelector(".resource-status-dot")
    dot?.setAttribute("aria-label", resourceStateLabel(state))
    const tooltip = group.querySelector(".resource-status-title")
    if (tooltip) tooltip.textContent = resourceStateLabel(state)
  }
}

function renderEventTimeline(value) {
  const source = value && typeof value === "object"
    ? Array.isArray(value.entries) ? value.entries : Array.isArray(value.lines) ? value.lines : []
    : []
  const events = source.map(normalizeTimelineEvent).filter((event) => event.time !== undefined)
    .sort((left, right) => left.time - right.time)
  if (!events.length) return element("p", { class: "timeline-empty" }, locale === "ru" ? "За выбранный период событий нет." : "No events in this time range.")

  const padding = 30_000
  const minimumTime = Math.min(...events.map(({ time }) => time))
  const maximumTime = Math.max(...events.map(({ time, duration }) => time + duration))
  const start = maximumTime === minimumTime ? minimumTime - padding : minimumTime
  const end = maximumTime === minimumTime ? maximumTime + padding : maximumTime
  const range = Math.max(1, end - start)
  const timeline = element("section", { class: "event-timeline", "aria-label": locale === "ru" ? "Таймлайн событий" : "Event timeline" })
  const axis = element("div", { class: "timeline-axis" })
  axis.append(element("span", {}, locale === "ru" ? "Событие" : "Event"))
  const ticks = element("div", { class: "timeline-ticks" })
  const tickCount = 5
  for (let index = 0; index < tickCount; index += 1) {
    const tickTime = start + range * index / (tickCount - 1)
    ticks.append(element("time", {}, new Date(tickTime).toLocaleTimeString(locale, { hour: "2-digit", minute: "2-digit", second: "2-digit" })))
  }
  axis.append(ticks)
  timeline.append(axis)

  for (const event of events) {
    const row = element("details", { class: "timeline-row" })
    const summary = element("summary")
    const label = element("span", { class: "timeline-event-label" })
    label.append(element("span", { class: "timeline-event-title" }, event.title))
    label.append(element("span", { class: "timeline-event-meta" }, `${new Date(event.time).toLocaleTimeString(locale)}${event.meta ? ` · ${event.meta}` : ""}`))
    const track = element("span", { class: "timeline-track" })
    const left = Math.max(0, Math.min(100, (event.time - start) / range * 100))
    const width = event.duration ? Math.max(.7, Math.min(100 - left, event.duration / range * 100)) : .7
    track.append(element("span", { class: "timeline-bar", "data-level": event.level, "data-status": event.status, "aria-hidden": "true" }))
    track.firstElementChild.style.setProperty("--timeline-start", `${left}%`)
    track.firstElementChild.style.setProperty("--timeline-width", `${width}%`)
    summary.append(label, track)
    row.append(summary, element("div", { class: "timeline-event-detail" }, jsonBlock(event.source)))
    timeline.append(row)
  }

  return timeline
}

function normalizeTimelineEvent(value) {
  const source = value && typeof value === "object" ? value : { message: String(value) }
  const rawTime = source.time ?? source.timestamp ?? source.startedAt ?? source.createdAt ?? source.ts
  const numericTime = typeof rawTime === "number" || typeof rawTime === "string" && /^\d+(?:\.\d+)?$/.test(rawTime)
    ? Number(rawTime)
    : Number.NaN
  const time = Number.isFinite(numericTime)
    ? numericTime > 100_000_000_000_000 ? numericTime / 1_000_000 : numericTime > 10_000_000_000 ? numericTime : numericTime * 1_000
    : Date.parse(String(rawTime ?? ""))
  const duration = Number(source.durationMs ?? source.duration ?? 0)
  const title = source.method && source.path ? `${source.method} ${source.path}` : String(source.msg ?? source.message ?? source.detail ?? source.context ?? source.name ?? "Event")
  const meta = [source.statusCode ?? source.status, Number.isFinite(duration) && duration > 0 ? `${duration} ms` : undefined]
    .filter((part) => part !== undefined).join(" · ")

  return {
    source,
    time: Number.isFinite(time) ? time : undefined,
    duration: Number.isFinite(duration) ? Math.max(0, duration) : 0,
    title,
    meta,
    level: typeof source.level === "number"
      ? source.level >= 40 ? "error" : source.level >= 30 ? "info" : "debug"
      : String(source.level ?? "").toLowerCase().includes("error") ? "error"
      : String(source.level ?? "").toLowerCase().includes("warn") ? "warn" : String(source.level ?? "").toLowerCase(),
    status: Number(source.statusCode ?? source.status) >= 400 ? "error" : "ok",
  }
}

function resourceStateLabel(state) {
  const key = { running: "resourceRunning", starting: "resourceStarting", stopped: "resourceStopped", degraded: "resourceDegraded", unreachable: "resourceUnreachable", unknown: "resourceUnknown" }[state] ?? "resourceUnknown"
  return resourceText(key, state ?? "unknown")
}

async function openResourceSettings() {
  if (!resourcePanel.open) resourcePanel.showModal()
  resourceInspectorBody.hidden = true
  resourceSettingsBody.hidden = false
  resourcePanelTitle.textContent = resourceText("resourceSettingsTitle", "Connection settings")
  resourceSettingsBody.replaceChildren()
  if (!inspectorAvailable) {
    resourceSettingsBody.append(element("p", { class: "resource-notice" }, resourceText("resourceInspectorStatic", "Live inspection needs the local resource-inspector viewer.")))
    return
  }
  try {
    const response = await fetch(inspectorUrl("/__resource-inspector/settings"), { credentials: "same-origin", redirect: "error" })
    if (!response.ok) throw new Error()
    const payload = await response.json()
    const profile = payload.profiles.find((item) => item.id === resourceProfileSelect.value)
    const form = element("form", { class: "resource-settings" })
    form.append(element("p", { class: "resource-notice" }, resourceText("resourceSettingsHelp", "Values from .env are defaults. Secret values are write-only; saved edits apply after a successful connection check.")))
    for (const connector of profile?.connectors ?? []) {
      for (const setting of connector.settings) {
        const input = element("input", { type: "password", name: setting.variable, autocomplete: "new-password", placeholder: setting.configured ? resourceText("resourceConfigured", "Configured; enter a replacement") : resourceText("resourceNotConfigured", "Not configured") })
        form.append(element("label", { class: "resource-setting" }, element("span", {}, setting.variable), input))
      }
    }
    const save = element("button", { type: "submit" }, resourceText("resourceSave", "Save and check"))
    form.append(save)
    form.addEventListener("submit", async (event) => {
      event.preventDefault()
      const values = Object.fromEntries([...form.querySelectorAll("input")].filter((input) => input.value).map((input) => [input.name, input.value]))
      if (!Object.keys(values).length) return
      save.disabled = true
      try {
        const saved = await fetch(inspectorUrl("/__resource-inspector/settings/secrets"), {
          method: "POST", credentials: "same-origin", redirect: "error", headers: { "content-type": "application/json" },
          body: JSON.stringify({ profileId: resourceProfileSelect.value, values }),
        })
        if (!saved.ok) throw new Error()
        form.reset()
        resourceSettingsBody.append(element("p", { class: "resource-notice" }, resourceText("resourceSaved", "Settings saved and connection checked.")))
      } catch {
        resourceSettingsBody.append(element("p", { class: "resource-notice" }, resourceText("resourceFailed", "Connection check failed; settings were not saved.")))
      } finally {
        save.disabled = false
      }
    })
    resourceSettingsBody.append(form)
  } catch {
    resourceSettingsBody.append(element("p", { class: "resource-notice" }, resourceText("resourceFailed", "Unable to load connection settings.")))
  }
}

function schemaType(schema) {
  if (!schema || typeof schema !== "object") return String(schema ?? "unknown")
  if (schema.type === "array") return "Array"

  return schema.type ?? "object"
}

function renderSchema(name, schema, depth = 0, required = false) {
  const root = element("details", { class: `schema-row schema-depth-${Math.min(depth, 4)}` })
  if (depth === 0) {
    root.classList.add("schema-root")
    root.open = true
  }

  const summary = element("summary", { class: "schema-summary" })
  summary.append(element("span", { class: "schema-name" }, name))
  summary.append(element("span", { class: "schema-type" }, schemaType(schema)))
  if (required) summary.append(element("span", { class: "schema-required" }, ui("required", "required")))
  root.append(summary)

  if (Array.isArray(schema?.enum)) {
    const values = element("div", { class: "enum-values" })
    schema.enum.forEach((value) => values.append(element("span", { class: "enum-value" }, String(value))))
    root.append(values)
  }

  if (schema?.nullable === true) root.append(element("div", { class: "schema-type" }, "nullable"))

  const requiredFields = new Set(schema?.required ?? [])
  for (const [field, child] of Object.entries(schema?.properties ?? {})) {
    root.append(renderSchema(field, child, depth + 1, requiredFields.has(field)))
  }
  if (schema?.items) root.append(renderSchema("items", schema.items, depth + 1))

  return root
}

function activateTab(index, updateHash = true) {
  for (const [tabIndex, tab] of [...tabList.querySelectorAll('[role="tab"]')].entries()) {
    tab.setAttribute("aria-selected", String(tabIndex === index))
    panels.children[tabIndex].hidden = tabIndex !== index
  }

  if (updateHash) history.replaceState(null, "", `#${encodeURIComponent(data.tabs[index].id)}`)
}

function activateEndpoint(panel, id) {
  const endpoint = data.endpoints.find((item) => item.id === id)
  if (!endpoint) return

  panel.querySelectorAll(".endpoint-list button").forEach((button) => {
    button.setAttribute("aria-pressed", String(button.dataset.endpointId === id))
  })
  panel.querySelectorAll(".node,.edge").forEach((item) => item.classList.remove("is-active", "is-connected"))

  for (const node of panel.querySelectorAll(".node")) {
    if ((node.dataset.endpointIds ?? "").split(" ").includes(id)) node.classList.add("is-active")
  }
  for (const edge of panel.querySelectorAll(".edge")) {
    const nodeIds = [edge.dataset.from, edge.dataset.to]
    const isConnected = nodeIds.some((nodeId) => {
      const node = panel.querySelector(`[data-node-id="${CSS.escape(nodeId)}"]`)
      return node?.dataset.endpointIds?.split(" ").includes(id)
    })
    if (isConnected) edge.classList.add("is-connected")
  }

  const details = panel.querySelector(".endpoint-details")
  details.replaceChildren(element("h2", {}, endpoint.method + " " + endpoint.path))
  if (endpoint.description) details.append(element("p", {}, localized("endpoints", id, "description", endpoint.description)))

  const grid = element("div", { class: "contract-grid" })
  const responseSection = element("section")
  responseSection.append(element("h3", {}, ui("response", "Response")))
  responseSection.append(element("p", {}, endpoint.responseType ?? ui("unknownResponse", "Unknown response")))
  grid.append(responseSection)

  for (const [title, value] of [
    [ui("parameters", "Parameters"), endpoint.parameters ?? ui("noParameters", "No parameters")],
    [ui("request", "Request"), endpoint.request ?? ui("noRequestBody", "No request body")],
    [ui("responseExample", "Response example"), endpoint.responseExample ?? null],
  ]) {
    const section = element("section")
    section.append(element("h3", {}, title), jsonBlock(value))
    grid.append(section)
  }

  details.append(grid)
  if (endpoint.responseSchema) {
    details.append(element("h3", { class: "schema-heading" }, ui("responseFields", "Response fields") + ": " + endpoint.responseType))
    details.append(renderSchema(endpoint.responseType, endpoint.responseSchema))
  }
  details.hidden = false
  details.scrollIntoView({ block: "start", behavior: "auto" })
}

function renderDiagram(diagram) {
  const figure = element("figure", { "data-diagram-overflow": "internal-scroll" })
  const svg = svgElement("svg", { class: "diagram", viewBox: diagram.viewBox, role: "group", "aria-label": diagram.title })
  const defs = svgElement("defs")
  const marker = svgElement("marker", {
    id: "arrow-" + diagram.id,
    markerWidth: "7",
    markerHeight: "7",
    refX: "6",
    refY: "3.5",
    orient: "auto",
  })
  marker.append(svgElement("path", { d: "M0 0 L7 3.5 L0 7 Z", fill: "context-stroke" }))
  defs.append(marker)
  svg.append(defs)

  for (const edge of diagram.edges) {
    const path = svgElement("path", {
      class: "edge",
      id: edge.id,
      d: edge.path,
      "marker-end": `url(#arrow-${diagram.id})`,
      "data-from": edge.from,
      "data-to": edge.to,
    })
    svg.append(path)
    svg.append(svgElement("path", {
      class: "edge-hit-area",
      d: edge.path,
      "data-from": edge.from,
      "data-to": edge.to,
      "data-tooltip": localized("edges", `${diagram.id}:${edge.id}`, "tooltip", edge.tooltip ?? edge.label),
      "aria-label": localized("edges", `${diagram.id}:${edge.id}`, "tooltip", edge.tooltip ?? edge.label),
      tabindex: "0",
    }))
    const translatedEdgeLabel = localized("edges", `${diagram.id}:${edge.id}`, "label", edge.label)
    svg.append(svgElement("text", { class: "edge-label", x: edge.labelX, y: edge.labelY }, translatedEdgeLabel))
  }

  for (const node of diagram.nodes) {
    node.diagramId = diagram.id
    const hasResources = Object.keys(node.resourceRefsByProfile ?? {}).length > 0
    const hasEndpoints = (node.endpointIds ?? []).length > 0
    const group = svgElement("g", {
      class: "node",
      "data-node-id": node.id,
      "data-diagram-id": diagram.id,
      "data-kind": node.kind ?? "api",
      "data-endpoint-ids": (node.endpointIds ?? []).join(" "),
      "data-resource-node": hasResources ? "true" : "false",
      ...(hasResources ? { "data-resource-state": "unknown" } : {}),
      tabindex: hasEndpoints || hasResources ? "0" : "-1",
      role: hasEndpoints || hasResources ? "button" : "group",
      "aria-label": localized("nodes", `${diagram.id}:${node.id}`, "title", node.title),
    })
    group.append(svgElement("rect", { x: node.x, y: node.y, width: node.width, height: node.height, rx: "6" }))
    group.append(svgElement("text", { x: node.x + node.width / 2, y: node.y + node.height / 2 - 4 }, localized("nodes", `${diagram.id}:${node.id}`, "title", node.title)))
    if (node.subtitle) {
      group.append(svgElement("text", {
        class: "subtitle",
        x: node.x + node.width / 2,
        y: node.y + node.height / 2 + 19,
      }, localized("nodes", `${diagram.id}:${node.id}`, "subtitle", node.subtitle)))
    }
    if (hasResources) {
      group.append(svgElement("circle", {
        class: "resource-status-pulse",
        cx: node.x + node.width - 10,
        cy: node.y + 10,
        r: "2.5",
      }))
      group.append(svgElement("circle", {
        class: "resource-status-dot",
        cx: node.x + node.width - 10,
        cy: node.y + 10,
        r: "2.5",
        "aria-label": resourceStateLabel("unknown"),
      }))
      group.append(svgElement("title", { class: "resource-status-title" }, resourceStateLabel("unknown")))
    }
    svg.append(group)
  }

  figure.append(svg)
  figure.addEventListener("pointerover", (event) => {
    const target = event.target.closest(".edge-hit-area")
    if (!target) return

    edgeTooltip.textContent = target.dataset.tooltip
    edgeTooltip.hidden = false
    positionTooltip(event.clientX, event.clientY)

    for (const nodeId of [target.dataset.from, target.dataset.to]) {
      figure.querySelector(`[data-node-id="${CSS.escape(nodeId)}"]`)?.classList.add("is-connected")
    }
    figure.querySelectorAll(".edge").forEach((edge) => {
      if (edge.dataset.from === target.dataset.from && edge.dataset.to === target.dataset.to) edge.classList.add("is-active")
    })
  })
  figure.addEventListener("pointermove", (event) => {
    if (!edgeTooltip.hidden) positionTooltip(event.clientX, event.clientY)
  })
  figure.addEventListener("focusin", (event) => {
    const target = event.target.closest(".edge-hit-area")
    if (!target) return
    edgeTooltip.textContent = target.dataset.tooltip
    edgeTooltip.hidden = false
    const bounds = target.getBoundingClientRect()
    positionTooltip(bounds.left + bounds.width / 2, bounds.top + bounds.height / 2)
  })
  figure.addEventListener("focusout", (event) => {
    if (event.target.closest(".edge-hit-area")) edgeTooltip.hidden = true
  })
  figure.addEventListener("pointerout", (event) => {
    const target = event.target.closest(".edge-hit-area")
    if (!target || target.contains(event.relatedTarget)) return
    figure.querySelectorAll(".node,.edge").forEach((item) => item.classList.remove("is-connected", "is-active"))
    edgeTooltip.hidden = true
  })
  figure.addEventListener("click", (event) => {
    const node = event.target.closest(".node")
    const endpointId = node?.dataset.endpointIds?.split(" ")[0]
    if (endpointId) activateEndpoint(figure.closest("[role=tabpanel]"), endpointId)
    const resourceNode = node?.dataset.resourceNode === "true" ? findResourceNode(node.dataset.diagramId, node.dataset.nodeId) : undefined
    if (resourceNode) void renderResourceNode(resourceNode)
  })
  figure.addEventListener("keydown", (event) => {
    if (event.key !== "Enter" && event.key !== " ") return
    const node = event.target.closest(".node")
    if (!node || (node.dataset.resourceNode !== "true" && !node.dataset.endpointIds)) return
    event.preventDefault()
    const endpointId = node.dataset.endpointIds?.split(" ")[0]
    if (endpointId) activateEndpoint(figure.closest("[role=tabpanel]"), endpointId)
    const resourceNode = node.dataset.resourceNode === "true" ? findResourceNode(node.dataset.diagramId, node.dataset.nodeId) : undefined
    if (resourceNode) void renderResourceNode(resourceNode)
  })

  return figure
}

function findResourceNode(diagramId, nodeId) {
  return data.tabs.flatMap((tab) => tab.diagrams).find((diagram) => diagram.id === diagramId)?.nodes.find((node) => node.id === nodeId)
}

let previousTabGroup
data.tabs.forEach((tab, index) => {
  if (tab.group && tab.group !== previousTabGroup) {
    const heading = tab.group === "data-model"
      ? ui("dataModelGroup", "Data model")
      : ui("processesGroup", "Processes and services")
    tabList.append(element("span", { class: "tab-group-heading", "aria-hidden": "true" }, heading))
    previousTabGroup = tab.group
  }
  const tabTitle = localized("tabs", tab.id, "title", tab.title)
  const button = element("button", { type: "button", role: "tab", "aria-selected": "false" }, tabTitle)
  button.addEventListener("click", () => activateTab(index))
  tabList.append(button)

  const panel = element("section", { role: "tabpanel", hidden: "" })
  panel.append(element("h2", {}, tabTitle))
  tab.diagrams.forEach((diagram) => {
    diagram.title = localized("diagrams", diagram.id, "title", diagram.title)
    panel.append(renderDiagram(diagram))
  })

  const list = element("div", { class: "endpoint-list" })
  for (const id of tab.endpointIds ?? []) {
    const endpoint = data.endpoints.find((item) => item.id === id)
    const entry = element("button", {
      type: "button",
      "data-endpoint-id": id,
      "aria-pressed": "false",
    }, endpoint.method + " " + endpoint.path)
    entry.addEventListener("click", () => activateEndpoint(panel, id))
    list.append(entry)
  }

  panel.append(list, element("div", { class: "endpoint-details", hidden: "" }))
  panels.append(panel)
})

function setTheme(theme) {
  document.documentElement.dataset.theme = theme
  const icon = theme === "dark" ? "sun" : "moon"
  const accessibleLabel = theme === "dark" ? ui("switchToLightTheme", "Switch to light theme") : ui("switchToDarkTheme", "Switch to dark theme")

  themeToggle.innerHTML = theme === "dark" ? SunIcon : MoonIcon

  themeToggle.setAttribute("aria-label", accessibleLabel)
  themeToggle.title = accessibleLabel
  themeToggle.setAttribute("aria-pressed", String(theme === "dark"))
}

setLocaleControl()
languageToggle.addEventListener("click", () => {
  const nextLocale = locale === "ru" ? "en" : "ru"
  try { localStorage.setItem(localeStorageKey, nextLocale) } catch {}
  location.reload()
})

let savedTheme
try {
  savedTheme = localStorage.getItem("architecture-map-theme")
} catch {}
setTheme(savedTheme === "dark" || savedTheme === "light"
  ? savedTheme
  : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
themeToggle.addEventListener("click", () => {
  const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark"
  setTheme(nextTheme)
  try {
    localStorage.setItem("architecture-map-theme", nextTheme)
  } catch {}
})

const selectedTab = data.tabs.findIndex((tab) => "#" + encodeURIComponent(tab.id) === location.hash)
activateTab(selectedTab < 0 ? 0 : selectedTab, false)
void initializeResourceInspector()
window.addEventListener("hashchange", () => {
  const nextTab = data.tabs.findIndex((tab) => "#" + encodeURIComponent(tab.id) === location.hash)
  if (nextTab >= 0) activateTab(nextTab, false)
})
</script>
