<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{color-scheme:light dark;font:16px/1.5 system-ui,sans-serif;--surface:#fff;--text:#20242a;--muted:#707781;--line:#8c949e;--border:#dce1e6;--accent:#3788ed}
:root[data-theme="dark"]{--surface:#17191d;--text:#eef0f3;--muted:#a4aab2;--line:#8b929b;--border:#393d44;color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}html{min-height:100%;overflow-y:auto}body{min-height:100vh;margin:0;background:var(--surface);color:var(--text)}main{width:100%;padding:clamp(1rem,2.5vw,2.5rem)}
header{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1rem}h1{margin:0;font-size:clamp(1.4rem,2.4vw,2rem)}.header-controls{display:flex;align-items:center;gap:.5rem}.language-toggle{min-width:3rem}.theme-toggle{display:grid;flex:none;width:2.5rem;height:2.5rem;place-items:center;padding:0;border-radius:50%}.theme-toggle svg{width:1.3rem;height:1.3rem}
.tabs{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 1.25rem}button{border:1px solid var(--border);border-radius:.65rem;background:transparent;color:inherit;padding:.55rem .8rem;font:inherit;cursor:pointer}button:focus-visible,.resource-hub-link:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button[aria-selected=true],button[aria-pressed=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}[hidden]{display:none!important}
figure{margin:0;overflow:auto;border:1px solid var(--border);border-radius:.75rem;background:color-mix(in srgb,var(--text) 2%,var(--surface))}.diagram{display:block;width:100%;height:auto;min-width:760px}
.node rect{stroke:#bcc6d1;stroke-width:1.5;fill:#e8f2ff}.node[data-kind="service"] rect{fill:#fff0e5}.node[data-kind="entity"] rect{fill:#e7f5ec}.node[data-kind="external"] rect{fill:var(--surface);stroke-dasharray:6 5}.node text{fill:#20242a;text-anchor:middle;pointer-events:none}.node .subtitle{fill:#68717c;font-size:13px}.node[role="button"]{cursor:pointer}.node[role="button"]:focus-visible rect{stroke:var(--accent);stroke-width:3}
.edge{fill:none;stroke:var(--line);stroke-width:1.7;stroke-linecap:square;stroke-linejoin:miter;vector-effect:non-scaling-stroke}.edge-label{fill:var(--muted);font-size:13px;text-anchor:middle;paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}
.node.is-active rect,.edge.is-active{stroke:var(--accent);stroke-width:3}.node.is-connected rect{stroke:var(--accent);stroke-width:2.5}.edge-hit-area{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:help}.edge-tooltip{position:fixed;z-index:10;max-width:min(28rem,calc(100vw - 2rem));padding:.55rem .75rem;border:1px solid var(--border);border-radius:.55rem;background:var(--surface);color:var(--text);box-shadow:0 5px 20px #0002;pointer-events:none}
.endpoint-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,22rem),1fr));gap:.5rem;margin:1.25rem 0}.endpoint-list button{text-align:left;overflow-wrap:anywhere}.endpoint-details{border-top:1px solid var(--border);padding-top:1rem;scroll-margin-top:1rem}.endpoint-details h2{margin:.3rem 0;font-size:1.15rem}.endpoint-details p{color:var(--muted)}
.resource-controls{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin:0 0 1rem}.resource-controls label{display:flex;align-items:center;gap:.5rem}.resource-profile-select,.resource-settings input{max-width:100%;min-height:2.75rem;border:1px solid var(--border);border-radius:.7rem;background:var(--surface);color:var(--text);padding:.55rem .8rem;font:inherit}.resource-profile-select{min-width:14rem;appearance:none;box-shadow:0 1px 2px #0001;background-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2716%27 height=%2716%27 viewBox=%270 0 16 16%27 fill=%27none%27 stroke=%27%23707881%27 stroke-width=%271.5%27%3E%3Cpath d=%27m4 6 4 4 4-4%27/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right .8rem center;padding-right:2.5rem}.resource-controls label{font-weight:600}.resource-hub-link{display:inline-flex;min-height:2.75rem;align-items:center;padding:.55rem .8rem;border:1px solid var(--border);border-radius:.7rem;color:inherit;text-decoration:none}.resource-hub-link:hover{border-color:var(--accent);color:var(--accent)}.resource-panel{width:min(54rem,calc(100vw - 2rem));max-height:min(84vh,60rem);padding:1.25rem;border:1px solid var(--border);border-radius:1rem;background:var(--surface);color:var(--text);box-shadow:0 24px 80px #0005;overflow:auto}.resource-panel::backdrop{background:#0b1018a8;backdrop-filter:blur(3px)}.resource-panel header{position:sticky;top:-1.25rem;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:1rem;margin:-1.25rem -1.25rem 1rem;padding:1rem 1.25rem;background:var(--surface);border-bottom:1px solid var(--border)}.resource-view-controls{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:.35rem}.resource-view-controls button{min-height:2.2rem;padding:.35rem .65rem;font-size:.9rem}.resource-view-controls button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}.resource-panel h2,.resource-panel h3{margin:.25rem 0}.resource-item{display:grid;grid-template-columns:minmax(10rem,1fr) minmax(12rem,2fr);gap:.5rem 1rem;padding:.8rem 0;border-top:1px solid var(--border)}.resource-status{color:var(--muted)}.resource-status[data-state="running"]{color:#188449}.resource-status[data-state="stopped"],.resource-status[data-state="degraded"],.resource-status[data-state="unreachable"]{color:#c74343}.resource-status[data-state="starting"]{color:#a35d00}.resource-result{grid-column:1/-1}.resource-settings{display:grid;gap:.75rem}.resource-setting{display:grid;grid-template-columns:minmax(10rem,1fr) minmax(12rem,2fr);align-items:center;gap:.5rem}.resource-notice{color:var(--muted)}
.contract-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,17rem),1fr));gap:1rem}.contract-grid h3,.schema-heading{margin:.5rem 0;font-size:1rem;font-weight:600}
pre{max-width:100%;margin:0;overflow:auto;padding:1rem;border-radius:.6rem;background:color-mix(in srgb,var(--text) 5%,var(--surface));white-space:pre-wrap;overflow-wrap:anywhere}pre>span{display:block}.json-depth-0{color:var(--muted)}.json-depth-1{color:color-mix(in srgb,var(--text) 88%,#44799b)}.json-depth-2{color:color-mix(in srgb,var(--text) 88%,#63835b)}.json-depth-3{color:color-mix(in srgb,var(--text) 88%,#98774f)}.json-depth-4{color:color-mix(in srgb,var(--text) 88%,#806997)}
details{margin:.4rem 0 .4rem 1rem}.schema-root{margin-left:0}.schema-row{padding:.2rem .35rem;border-radius:.3rem}.schema-depth-0>.schema-summary{background:color-mix(in srgb,#75849a 9%,var(--surface))}.schema-depth-1>.schema-summary{background:color-mix(in srgb,#5482a1 8%,var(--surface))}.schema-depth-2>.schema-summary{background:color-mix(in srgb,#66865d 8%,var(--surface))}.schema-depth-3>.schema-summary{background:color-mix(in srgb,#9c805a 8%,var(--surface))}.schema-depth-4>.schema-summary{background:color-mix(in srgb,#8a6f9f 8%,var(--surface))}.schema-summary{display:inline-flex;align-items:baseline;gap:.45rem;padding:.15rem .35rem;border-radius:.3rem;cursor:pointer}.schema-name,code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.schema-name{color:color-mix(in srgb,var(--text) 82%,#3c7090)}.schema-type{color:var(--muted);font-size:.9em}.schema-required{font-size:.75em;color:var(--muted)}.enum-values{display:flex;flex-wrap:wrap;gap:.3rem;margin:.3rem 0 .3rem 1rem}.enum-value{padding:.1rem .35rem;border-radius:.3rem;background:color-mix(in srgb,#74805f 10%,var(--surface));font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
@media(max-width:700px){main{padding:1rem}header{align-items:flex-start}.diagram{min-width:760px}.endpoint-list{grid-template-columns:1fr}.resource-item,.resource-setting{grid-template-columns:1fr}.resource-result{grid-column:auto}}
</style>
</head>
<body>
<main>
<header><h1>__TITLE__</h1><div class="header-controls"><button class="language-toggle" type="button" aria-label="Switch language to English" title="Switch language to English">EN</button><button class="theme-toggle" type="button" aria-label="Switch to light theme" title="Switch to light theme"></button></div></header>
<div class="resource-controls" hidden><label><span class="resource-profile-label"></span><select class="resource-profile-select"></select></label><button class="resource-settings-button" type="button"></button><a class="resource-hub-link" href="/" hidden>Проекты</a></div>
<dialog class="resource-panel" aria-labelledby="resource-panel-title"><header><h2 class="resource-panel-title" id="resource-panel-title"></h2><button class="resource-panel-close" type="button"></button></header><div class="resource-inspector-body"></div><div class="resource-settings-body" hidden></div></dialog>
<nav class="tabs" role="tablist"></nav><div class="panels"></div>
</main>
<script type="application/json" id="map-data">__MAP_DATA__</script>
<script>
const data = JSON.parse(document.getElementById("map-data").textContent)
const inspectorBasePath = document.querySelector('meta[name="resource-inspector-base-path"]')?.content ?? ""
const inspectorHubUrl = document.querySelector('meta[name="resource-inspector-hub-url"]')?.content ?? "/"
const inspectorUrl = (path) => `${inspectorBasePath}${path}`
const tabList = document.querySelector(".tabs")
const panels = document.querySelector(".panels")
const themeToggle = document.querySelector(".theme-toggle")
const languageToggle = document.querySelector(".language-toggle")
const resourceControls = document.querySelector(".resource-controls")
const resourceProfileSelect = document.querySelector(".resource-profile-select")
const resourceProfileLabel = document.querySelector(".resource-profile-label")
const resourceSettingsButton = document.querySelector(".resource-settings-button")
const resourceHubLink = document.querySelector(".resource-hub-link")
const resourcePanel = document.querySelector(".resource-panel")
const resourcePanelTitle = document.querySelector(".resource-panel-title")
const resourcePanelClose = document.querySelector(".resource-panel-close")
const resourceInspectorBody = document.querySelector(".resource-inspector-body")
const resourceSettingsBody = document.querySelector(".resource-settings-body")
const edgeTooltip = document.createElement("div")
edgeTooltip.className = "edge-tooltip"
edgeTooltip.setAttribute("role", "tooltip")
edgeTooltip.hidden = true
document.body.append(edgeTooltip)
const svgNamespace = "http://www.w3.org/2000/svg"
const SunIcon = __SUN_ICON__
const MoonIcon = __MOON_ICON__
const supportedLocales = ["ru", "en"]
const localeStorageKey = "architecture-map-locale"
let locale
try {
  const savedLocale = localStorage.getItem(localeStorageKey)
  locale = supportedLocales.includes(savedLocale) ? savedLocale : data.i18n?.defaultLocale
} catch {
  locale = data.i18n?.defaultLocale
}
if (!supportedLocales.includes(locale)) locale = "ru"
document.documentElement.lang = locale
tabList.setAttribute("aria-label", data.translations?.[locale]?.ui?.sectionsLabel ?? "Architecture map sections")
const localizedTitle = data.translations?.[locale]?.page?.title ?? data.title
document.title = localizedTitle
document.querySelector("h1").textContent = localizedTitle

function ui(key, fallback) {
  return data.translations?.[locale]?.ui?.[key] ?? fallback
}

function localized(section, id, field, fallback) {
  return data.translations?.[locale]?.[section]?.[id]?.[field] ?? fallback
}

function resourceText(key, fallback) {
  return ui(key, fallback)
}

function positionTooltip(x, y) {
  edgeTooltip.style.left = `${Math.max(8, Math.min(x + 12, window.innerWidth - edgeTooltip.offsetWidth - 8))}px`
  edgeTooltip.style.top = `${Math.max(8, Math.min(y + 12, window.innerHeight - edgeTooltip.offsetHeight - 8))}px`
}

function setLocaleControl() {
  const nextLocale = locale === "ru" ? "en" : "ru"
  const label = ui("switchLanguage", `Switch language to ${nextLocale.toUpperCase()}`)
  languageToggle.textContent = nextLocale.toUpperCase()
  languageToggle.setAttribute("aria-label", label)
  languageToggle.title = label
}


function element(name, attributes = {}, ...children) {
  const item = document.createElement(name)

  for (const [key, value] of Object.entries(attributes)) item.setAttribute(key, value)
  for (const child of children) {
    if (typeof child === "string") item.append(document.createTextNode(child))
    else if (child instanceof Node) item.append(child)
  }

  return item
}

function svgElement(name, attributes = {}, text) {
  const item = document.createElementNS(svgNamespace, name)

  for (const [key, value] of Object.entries(attributes)) item.setAttribute(key, value)
  if (text !== undefined) item.textContent = text

  return item
}

function jsonBlock(value) {
  const block = element("pre")
  const lines = JSON.stringify(value === undefined ? null : value, null, 2).split("\n")

  for (const line of lines) {
    const indentation = line.length - line.trimStart().length
    const depth = Math.min(Math.floor(indentation / 2), 4)
    const jsonLine = element("span", { class: `json-depth-${depth}` }, line.trimStart())
    jsonLine.style.paddingLeft = `${indentation}ch`
    block.append(jsonLine)
  }

  return block
}

let inspectorAvailable = false
let inspectorProfiles = []
let inspectorResources = []
let selectedResourceNode
const resourceProfileStorageKey = "architecture-map-resource-profile"

async function initializeResourceInspector() {
  const hasBindings = data.tabs.some((tab) => tab.diagrams.some((diagram) => diagram.nodes.some((node) => Object.keys(node.resourceRefsByProfile ?? {}).length)))
  if (!hasBindings) return

  resourceControls.hidden = false
  resourceProfileLabel.textContent = resourceText("resourceProfile", "Environment")
  resourceSettingsButton.textContent = resourceText("resourceSettings", "Connections")
  if (inspectorBasePath) { resourceHubLink.hidden = false; resourceHubLink.href = inspectorHubUrl }
  resourcePanelClose.textContent = resourceText("resourceClose", "Close")
  resourcePanelClose.setAttribute("aria-label", resourcePanelClose.textContent)
  resourcePanelClose.addEventListener("click", () => resourcePanel.close())
  resourcePanel.addEventListener("click", (event) => { if (event.target === resourcePanel) resourcePanel.close() })
  resourcePanel.addEventListener("close", () => { selectedResourceNode = undefined })
  resourceSettingsButton.addEventListener("click", () => { void openResourceSettings() })
  resourceProfileSelect.addEventListener("change", () => {
    try { localStorage.setItem(resourceProfileStorageKey, resourceProfileSelect.value) } catch {}
    if (selectedResourceNode) void renderResourceNode(selectedResourceNode)
  })

  const declared = data.resourceProfiles ?? []
  inspectorProfiles = declared.map(({ id, name, kind }) => ({ id, name, kind }))
  try {
    const response = await fetch(inspectorUrl("/__resource-inspector/profiles"), { credentials: "same-origin", redirect: "error" })
    if (!response.ok) throw new Error()
    const payload = await response.json()
    inspectorProfiles = payload.profiles.filter((profile) => declared.some((item) => item.id === profile.id))
    inspectorAvailable = true
  } catch {
    inspectorAvailable = false
  }

  resourceProfileSelect.replaceChildren(...inspectorProfiles.map((profile) => element("option", { value: profile.id }, profile.name)))
  let savedProfile
  try { savedProfile = localStorage.getItem(resourceProfileStorageKey) } catch {}
  const selected = inspectorProfiles.some(({ id }) => id === savedProfile) ? savedProfile : inspectorProfiles[0]?.id
  if (selected) resourceProfileSelect.value = selected
  if (inspectorAvailable) {
    await loadInspectorResources()
    window.setInterval(() => { if (resourcePanel.open && selectedResourceNode && resourceSettingsBody.hidden) void refreshResourceStatuses() }, 15_000)
  }
}

async function loadInspectorResources() {
  try {
    const response = await fetch(inspectorUrl(`/__resource-inspector/resources?profileId=${encodeURIComponent(resourceProfileSelect.value)}`), { credentials: "same-origin", redirect: "error" })
    if (!response.ok) throw new Error()
    inspectorResources = (await response.json()).resources
  } catch {
    inspectorResources = []
  }
}

async function renderResourceNode(node) {
  selectedResourceNode = node
  if (!resourcePanel.open) resourcePanel.showModal()
  resourceSettingsBody.hidden = true
  resourceInspectorBody.hidden = false
  resourcePanelTitle.textContent = localized("nodes", `${node.diagramId}:${node.id}`, "title", node.title)
  resourceInspectorBody.replaceChildren()
  const ids = node.resourceRefsByProfile?.[resourceProfileSelect.value] ?? []

  if (!inspectorAvailable) {
    resourceInspectorBody.append(element("p", { class: "resource-notice" }, resourceText("resourceInspectorStatic", "Live inspection needs the local resource-inspector viewer. Open this map using the documented command.")))
    return
  }
  if (!ids.length) {
    resourceInspectorBody.append(element("p", { class: "resource-notice" }, resourceText("resourceNoBinding", "This node has no resource binding in the selected profile.")))
    return
  }

  await loadInspectorResources()
  for (const id of ids) {
    const resource = inspectorResources.find((item) => item.id === id)
    if (!resource) {
      resourceInspectorBody.append(element("p", { class: "resource-notice" }, `${id}: ${resourceText("resourceMissing", "resource is not configured")}`))
      continue
    }
    resourceInspectorBody.append(createResourceItem(resource))
  }
  await refreshResourceStatuses()
}

function createResourceItem(resource) {
  const item = element("article", { class: "resource-item", "data-resource-id": resource.id })
  const title = element("h3", {}, resource.name)
  const status = element("p", { class: "resource-status", "data-state": "unknown" }, resourceText("resourceLoading", "Checking status…"))
  const controls = element("div", { class: "resource-view-controls" })
  const metadata = element("div")
  metadata.append(title, status)
  const views = (resource.views ?? []).filter((view) => view !== "status")
  const result = element("pre", { class: "resource-result", hidden: "" })
  for (const [index, view] of views.entries()) {
    const inspect = element("button", { type: "button", "aria-pressed": String(index === 0) }, view)
    inspect.addEventListener("click", () => {
      controls.querySelectorAll("button").forEach((button) => button.setAttribute("aria-pressed", String(button === inspect)))
      void inspectResource(resource.id, view, result)
    })
    controls.append(inspect)
  }
  controls.hidden = views.length === 0
  item.append(metadata, controls, result)
  if (views.length) void inspectResource(resource.id, views[0], result)
  return item
}

async function refreshResourceStatuses() {
  if (!selectedResourceNode || !inspectorAvailable) return
  const items = resourceInspectorBody.querySelectorAll(".resource-item")
  await Promise.all([...items].map(async (item) => {
    const id = item.dataset.resourceId
    const status = item.querySelector(".resource-status")
    try {
      const query = new URLSearchParams({ profileId: resourceProfileSelect.value, resourceId: id })
      const response = await fetch(inspectorUrl(`/__resource-inspector/status?${query}`), { credentials: "same-origin", redirect: "error" })
      if (!response.ok) throw new Error()
      const value = await response.json()
      status.dataset.state = value.state ?? "unknown"
      status.textContent = `${resourceStateLabel(value.state)} · ${new Date(value.checkedAt).toLocaleTimeString(locale)}`
      if (value.exitCode !== undefined) status.textContent += ` · exit ${value.exitCode}`
    } catch {
      status.dataset.state = "unreachable"
      status.textContent = resourceText("resourceFailed", "Status unavailable")
    }
  }))
}

async function inspectResource(resourceId, view, result) {
  result.hidden = false
  result.textContent = resourceText("resourceLoading", "Loading…")
  try {
    const response = await fetch(inspectorUrl("/__resource-inspector/inspect"), {
      method: "POST",
      credentials: "same-origin",
      redirect: "error",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ profileId: resourceProfileSelect.value, resourceId, view }),
    })
    if (!response.ok) throw new Error()
    const output = jsonBlock(await response.json())
    result.replaceChildren(...output.childNodes)
  } catch {
    result.textContent = resourceText("resourceFailed", "Inspection failed")
  }
}

function resourceStateLabel(state) {
  const key = { running: "resourceRunning", starting: "resourceStarting", stopped: "resourceStopped", degraded: "resourceDegraded", unreachable: "resourceUnreachable", unknown: "resourceUnknown" }[state] ?? "resourceUnknown"
  return resourceText(key, state ?? "unknown")
}

async function openResourceSettings() {
  if (!resourcePanel.open) resourcePanel.showModal()
  resourceInspectorBody.hidden = true
  resourceSettingsBody.hidden = false
  resourcePanelTitle.textContent = resourceText("resourceSettingsTitle", "Connection settings")
  resourceSettingsBody.replaceChildren()
  if (!inspectorAvailable) {
    resourceSettingsBody.append(element("p", { class: "resource-notice" }, resourceText("resourceInspectorStatic", "Live inspection needs the local resource-inspector viewer.")))
    return
  }
  try {
    const response = await fetch(inspectorUrl("/__resource-inspector/settings"), { credentials: "same-origin", redirect: "error" })
    if (!response.ok) throw new Error()
    const payload = await response.json()
    const profile = payload.profiles.find((item) => item.id === resourceProfileSelect.value)
    const form = element("form", { class: "resource-settings" })
    form.append(element("p", { class: "resource-notice" }, resourceText("resourceSettingsHelp", "Values from .env are defaults. Secret values are write-only; saved edits apply after a successful connection check.")))
    for (const connector of profile?.connectors ?? []) {
      for (const setting of connector.settings) {
        const input = element("input", { type: "password", name: setting.variable, autocomplete: "new-password", placeholder: setting.configured ? resourceText("resourceConfigured", "Configured; enter a replacement") : resourceText("resourceNotConfigured", "Not configured") })
        form.append(element("label", { class: "resource-setting" }, element("span", {}, setting.variable), input))
      }
    }
    const save = element("button", { type: "submit" }, resourceText("resourceSave", "Save and check"))
    form.append(save)
    form.addEventListener("submit", async (event) => {
      event.preventDefault()
      const values = Object.fromEntries([...form.querySelectorAll("input")].filter((input) => input.value).map((input) => [input.name, input.value]))
      if (!Object.keys(values).length) return
      save.disabled = true
      try {
        const saved = await fetch(inspectorUrl("/__resource-inspector/settings/secrets"), {
          method: "POST", credentials: "same-origin", redirect: "error", headers: { "content-type": "application/json" },
          body: JSON.stringify({ profileId: resourceProfileSelect.value, values }),
        })
        if (!saved.ok) throw new Error()
        form.reset()
        resourceSettingsBody.append(element("p", { class: "resource-notice" }, resourceText("resourceSaved", "Settings saved and connection checked.")))
      } catch {
        resourceSettingsBody.append(element("p", { class: "resource-notice" }, resourceText("resourceFailed", "Connection check failed; settings were not saved.")))
      } finally {
        save.disabled = false
      }
    })
    resourceSettingsBody.append(form)
  } catch {
    resourceSettingsBody.append(element("p", { class: "resource-notice" }, resourceText("resourceFailed", "Unable to load connection settings.")))
  }
}

function schemaType(schema) {
  if (!schema || typeof schema !== "object") return String(schema ?? "unknown")
  if (schema.type === "array") return "Array"

  return schema.type ?? "object"
}

function renderSchema(name, schema, depth = 0, required = false) {
  const root = element("details", { class: `schema-row schema-depth-${Math.min(depth, 4)}` })
  if (depth === 0) {
    root.classList.add("schema-root")
    root.open = true
  }

  const summary = element("summary", { class: "schema-summary" })
  summary.append(element("span", { class: "schema-name" }, name))
  summary.append(element("span", { class: "schema-type" }, schemaType(schema)))
  if (required) summary.append(element("span", { class: "schema-required" }, ui("required", "required")))
  root.append(summary)

  if (Array.isArray(schema?.enum)) {
    const values = element("div", { class: "enum-values" })
    schema.enum.forEach((value) => values.append(element("span", { class: "enum-value" }, String(value))))
    root.append(values)
  }

  if (schema?.nullable === true) root.append(element("div", { class: "schema-type" }, "nullable"))

  const requiredFields = new Set(schema?.required ?? [])
  for (const [field, child] of Object.entries(schema?.properties ?? {})) {
    root.append(renderSchema(field, child, depth + 1, requiredFields.has(field)))
  }
  if (schema?.items) root.append(renderSchema("items", schema.items, depth + 1))

  return root
}

function activateTab(index, updateHash = true) {
  for (const [tabIndex, tab] of [...tabList.children].entries()) {
    tab.setAttribute("aria-selected", String(tabIndex === index))
    panels.children[tabIndex].hidden = tabIndex !== index
  }

  if (updateHash) history.replaceState(null, "", `#${encodeURIComponent(data.tabs[index].id)}`)
}

function activateEndpoint(panel, id) {
  const endpoint = data.endpoints.find((item) => item.id === id)
  if (!endpoint) return

  panel.querySelectorAll(".endpoint-list button").forEach((button) => {
    button.setAttribute("aria-pressed", String(button.dataset.endpointId === id))
  })
  panel.querySelectorAll(".node,.edge").forEach((item) => item.classList.remove("is-active", "is-connected"))

  for (const node of panel.querySelectorAll(".node")) {
    if ((node.dataset.endpointIds ?? "").split(" ").includes(id)) node.classList.add("is-active")
  }
  for (const edge of panel.querySelectorAll(".edge")) {
    const nodeIds = [edge.dataset.from, edge.dataset.to]
    const isConnected = nodeIds.some((nodeId) => {
      const node = panel.querySelector(`[data-node-id="${CSS.escape(nodeId)}"]`)
      return node?.dataset.endpointIds?.split(" ").includes(id)
    })
    if (isConnected) edge.classList.add("is-connected")
  }

  const details = panel.querySelector(".endpoint-details")
  details.replaceChildren(element("h2", {}, endpoint.method + " " + endpoint.path))
  if (endpoint.description) details.append(element("p", {}, localized("endpoints", id, "description", endpoint.description)))

  const grid = element("div", { class: "contract-grid" })
  const responseSection = element("section")
  responseSection.append(element("h3", {}, ui("response", "Response")))
  responseSection.append(element("p", {}, endpoint.responseType ?? ui("unknownResponse", "Unknown response")))
  grid.append(responseSection)

  for (const [title, value] of [
    [ui("parameters", "Parameters"), endpoint.parameters ?? ui("noParameters", "No parameters")],
    [ui("request", "Request"), endpoint.request ?? ui("noRequestBody", "No request body")],
    [ui("responseExample", "Response example"), endpoint.responseExample ?? null],
  ]) {
    const section = element("section")
    section.append(element("h3", {}, title), jsonBlock(value))
    grid.append(section)
  }

  details.append(grid)
  if (endpoint.responseSchema) {
    details.append(element("h3", { class: "schema-heading" }, ui("responseFields", "Response fields") + ": " + endpoint.responseType))
    details.append(renderSchema(endpoint.responseType, endpoint.responseSchema))
  }
  details.hidden = false
  details.scrollIntoView({ block: "start", behavior: "auto" })
}

function renderDiagram(diagram) {
  const figure = element("figure", { "data-diagram-overflow": "internal-scroll" })
  const svg = svgElement("svg", { class: "diagram", viewBox: diagram.viewBox, role: "group", "aria-label": diagram.title })
  const defs = svgElement("defs")
  const marker = svgElement("marker", {
    id: "arrow-" + diagram.id,
    markerWidth: "7",
    markerHeight: "7",
    refX: "6",
    refY: "3.5",
    orient: "auto",
  })
  marker.append(svgElement("path", { d: "M0 0 L7 3.5 L0 7 Z", fill: "context-stroke" }))
  defs.append(marker)
  svg.append(defs)

  for (const edge of diagram.edges) {
    const path = svgElement("path", {
      class: "edge",
      id: edge.id,
      d: edge.path,
      "marker-end": `url(#arrow-${diagram.id})`,
      "data-from": edge.from,
      "data-to": edge.to,
    })
    svg.append(path)
    svg.append(svgElement("path", {
      class: "edge-hit-area",
      d: edge.path,
      "data-from": edge.from,
      "data-to": edge.to,
      "data-tooltip": localized("edges", `${diagram.id}:${edge.id}`, "tooltip", edge.tooltip ?? edge.label),
      "aria-label": localized("edges", `${diagram.id}:${edge.id}`, "tooltip", edge.tooltip ?? edge.label),
      tabindex: "0",
    }))
    const translatedEdgeLabel = localized("edges", `${diagram.id}:${edge.id}`, "label", edge.label)
    svg.append(svgElement("text", { class: "edge-label", x: edge.labelX, y: edge.labelY }, translatedEdgeLabel))
  }

  for (const node of diagram.nodes) {
    node.diagramId = diagram.id
    const hasResources = Object.keys(node.resourceRefsByProfile ?? {}).length > 0
    const hasEndpoints = (node.endpointIds ?? []).length > 0
    const group = svgElement("g", {
      class: "node",
      "data-node-id": node.id,
      "data-diagram-id": diagram.id,
      "data-kind": node.kind ?? "api",
      "data-endpoint-ids": (node.endpointIds ?? []).join(" "),
      "data-resource-node": hasResources ? "true" : "false",
      tabindex: hasEndpoints || hasResources ? "0" : "-1",
      role: hasEndpoints || hasResources ? "button" : "group",
      "aria-label": localized("nodes", `${diagram.id}:${node.id}`, "title", node.title),
    })
    group.append(svgElement("rect", { x: node.x, y: node.y, width: node.width, height: node.height, rx: "6" }))
    group.append(svgElement("text", { x: node.x + node.width / 2, y: node.y + node.height / 2 - 4 }, localized("nodes", `${diagram.id}:${node.id}`, "title", node.title)))
    if (node.subtitle) {
      group.append(svgElement("text", {
        class: "subtitle",
        x: node.x + node.width / 2,
        y: node.y + node.height / 2 + 19,
      }, localized("nodes", `${diagram.id}:${node.id}`, "subtitle", node.subtitle)))
    }
    svg.append(group)
  }

  figure.append(svg)
  figure.addEventListener("pointerover", (event) => {
    const target = event.target.closest(".edge-hit-area")
    if (!target) return

    edgeTooltip.textContent = target.dataset.tooltip
    edgeTooltip.hidden = false
    positionTooltip(event.clientX, event.clientY)

    for (const nodeId of [target.dataset.from, target.dataset.to]) {
      figure.querySelector(`[data-node-id="${CSS.escape(nodeId)}"]`)?.classList.add("is-connected")
    }
    figure.querySelectorAll(".edge").forEach((edge) => {
      if (edge.dataset.from === target.dataset.from && edge.dataset.to === target.dataset.to) edge.classList.add("is-active")
    })
  })
  figure.addEventListener("pointermove", (event) => {
    if (!edgeTooltip.hidden) positionTooltip(event.clientX, event.clientY)
  })
  figure.addEventListener("focusin", (event) => {
    const target = event.target.closest(".edge-hit-area")
    if (!target) return
    edgeTooltip.textContent = target.dataset.tooltip
    edgeTooltip.hidden = false
    const bounds = target.getBoundingClientRect()
    positionTooltip(bounds.left + bounds.width / 2, bounds.top + bounds.height / 2)
  })
  figure.addEventListener("focusout", (event) => {
    if (event.target.closest(".edge-hit-area")) edgeTooltip.hidden = true
  })
  figure.addEventListener("pointerout", (event) => {
    const target = event.target.closest(".edge-hit-area")
    if (!target || target.contains(event.relatedTarget)) return
    figure.querySelectorAll(".node,.edge").forEach((item) => item.classList.remove("is-connected", "is-active"))
    edgeTooltip.hidden = true
  })
  figure.addEventListener("click", (event) => {
    const node = event.target.closest(".node")
    const endpointId = node?.dataset.endpointIds?.split(" ")[0]
    if (endpointId) activateEndpoint(figure.closest("[role=tabpanel]"), endpointId)
    const resourceNode = node?.dataset.resourceNode === "true" ? findResourceNode(node.dataset.diagramId, node.dataset.nodeId) : undefined
    if (resourceNode) void renderResourceNode(resourceNode)
  })
  figure.addEventListener("keydown", (event) => {
    if (event.key !== "Enter" && event.key !== " ") return
    const node = event.target.closest(".node")
    if (!node || (node.dataset.resourceNode !== "true" && !node.dataset.endpointIds)) return
    event.preventDefault()
    const endpointId = node.dataset.endpointIds?.split(" ")[0]
    if (endpointId) activateEndpoint(figure.closest("[role=tabpanel]"), endpointId)
    const resourceNode = node.dataset.resourceNode === "true" ? findResourceNode(node.dataset.diagramId, node.dataset.nodeId) : undefined
    if (resourceNode) void renderResourceNode(resourceNode)
  })

  return figure
}

function findResourceNode(diagramId, nodeId) {
  return data.tabs.flatMap((tab) => tab.diagrams).find((diagram) => diagram.id === diagramId)?.nodes.find((node) => node.id === nodeId)
}

data.tabs.forEach((tab, index) => {
  const tabTitle = localized("tabs", tab.id, "title", tab.title)
  const button = element("button", { type: "button", role: "tab", "aria-selected": "false" }, tabTitle)
  button.addEventListener("click", () => activateTab(index))
  tabList.append(button)

  const panel = element("section", { role: "tabpanel", hidden: "" })
  panel.append(element("h2", {}, tabTitle))
  tab.diagrams.forEach((diagram) => {
    diagram.title = localized("diagrams", diagram.id, "title", diagram.title)
    panel.append(renderDiagram(diagram))
  })

  const list = element("div", { class: "endpoint-list" })
  for (const id of tab.endpointIds ?? []) {
    const endpoint = data.endpoints.find((item) => item.id === id)
    const entry = element("button", {
      type: "button",
      "data-endpoint-id": id,
      "aria-pressed": "false",
    }, endpoint.method + " " + endpoint.path)
    entry.addEventListener("click", () => activateEndpoint(panel, id))
    list.append(entry)
  }

  panel.append(list, element("div", { class: "endpoint-details", hidden: "" }))
  panels.append(panel)
})

function setTheme(theme) {
  document.documentElement.dataset.theme = theme
  const icon = theme === "dark" ? "sun" : "moon"
  const accessibleLabel = theme === "dark" ? ui("switchToLightTheme", "Switch to light theme") : ui("switchToDarkTheme", "Switch to dark theme")

  themeToggle.innerHTML = theme === "dark" ? SunIcon : MoonIcon

  themeToggle.setAttribute("aria-label", accessibleLabel)
  themeToggle.title = accessibleLabel
  themeToggle.setAttribute("aria-pressed", String(theme === "dark"))
}

setLocaleControl()
languageToggle.addEventListener("click", () => {
  const nextLocale = locale === "ru" ? "en" : "ru"
  try { localStorage.setItem(localeStorageKey, nextLocale) } catch {}
  location.reload()
})

let savedTheme
try {
  savedTheme = localStorage.getItem("architecture-map-theme")
} catch {}
setTheme(savedTheme === "dark" || savedTheme === "light"
  ? savedTheme
  : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
themeToggle.addEventListener("click", () => {
  const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark"
  setTheme(nextTheme)
  try {
    localStorage.setItem("architecture-map-theme", nextTheme)
  } catch {}
})

const selectedTab = data.tabs.findIndex((tab) => "#" + encodeURIComponent(tab.id) === location.hash)
activateTab(selectedTab < 0 ? 0 : selectedTab, false)
void initializeResourceInspector()
window.addEventListener("hashchange", () => {
  const nextTab = data.tabs.findIndex((tab) => "#" + encodeURIComponent(tab.id) === location.hash)
  if (nextTab >= 0) activateTab(nextTab, false)
})
</script>
